<title>App: Unicorn Remote</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a "now playing" panel up top (status, brightness, stop), then the program library as a grid of LED tiles grouped by mood. Tap a tile to play it. */
:root{
  --bg:#eef0f5; --panel:#ffffff; --raise:#f5f6fa; --ink:#161925; --muted:#5d6377; --line:#d9dce6;
  --accent:#5b3df5; --on-accent:#ffffff; --live:#12a37a; --warn:#c2410c; --bad:#c62f4b; --led-off:#22252f;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0d12; --panel:#15171f; --raise:#1c1f2a; --ink:#ecedf4; --muted:#9499ad; --line:#2a2d3a;
  --accent:#8f7bff; --on-accent:#0c0d12; --live:#3ddbab; --warn:#fb923c; --bad:#ff6b85; --led-off:#1b1d26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0d12; --panel:#15171f; --raise:#1c1f2a; --ink:#ecedf4; --muted:#9499ad; --line:#2a2d3a;
  --accent:#8f7bff; --on-accent:#0c0d12; --live:#3ddbab; --warn:#fb923c; --bad:#ff6b85; --led-off:#1b1d26; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-family:var(--display);font-weight:700;font-size:1.9rem;margin:0;letter-spacing:.01em;line-height:1}
h2{font-family:var(--display);font-weight:500;font-size:1.05rem;margin:0;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.dot.on{background:var(--live);box-shadow:0 0 0 3px color-mix(in srgb,var(--live) 25%,transparent)}
.conn{font-size:.85rem;color:var(--muted)}
.now{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.now .big{width:84px;height:84px}
.nowinfo{display:flex;flex-direction:column;gap:8px;min-width:0}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.nowname{font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.nowsub{font-size:.88rem;color:var(--muted)}
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--raise);border-radius:10px;padding:7px 12px;font-weight:600;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:default}
.bright{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);flex:1 1 180px}
.bright input{flex:1;accent-color:var(--accent);min-width:0}
.bright output{font-family:var(--mono);font-size:.8rem;width:3.2em;text-align:right;color:var(--ink)}
.msg{font-size:.88rem;border-radius:10px;padding:10px 12px;background:var(--raise);border:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.msg.bad{border-color:color-mix(in srgb,var(--bad) 50%,var(--line));color:var(--bad)}
.group{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.tile:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.tile[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.tile .tn{font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.tile .td{font-size:.76rem;color:var(--muted);line-height:1.3;display:block;margin-top:2px}
.tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.tag{font-size:.64rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:99px;background:var(--raise);color:var(--muted)}
.tag.star{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.tag.live{background:color-mix(in srgb,var(--live) 18%,transparent);color:var(--live)}
.led{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;aspect-ratio:1;max-width:100%;background:#07080b;border-radius:7px;padding:4px}
.led i{border-radius:50%;background:var(--led-off)}
.big.led{grid-template-columns:repeat(6,1fr);gap:3px;padding:7px;border-radius:12px}
.tile[aria-pressed="true"] .led i{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{filter:brightness(.55)}}
@media (prefers-reduced-motion:reduce){.tile[aria-pressed="true"] .led i{animation:none}}
.menu{display:flex;gap:6px;flex-wrap:wrap}
.foot{font-size:.8rem;color:var(--muted)}
.modes{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.modes button{border:0;background:none;padding:6px 12px;font-size:.85rem;font-weight:600;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.rot{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.rothead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.chip{display:grid;grid-template-columns:28px 26px minmax(0,1fr) auto;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--raise);border-radius:10px;padding:5px 6px;font-size:.9rem;font-weight:600;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.chip:focus-visible{outline:2px solid var(--accent)}
.chip.dragging{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--raise));box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:grabbing}
.chip .grip{color:var(--muted);font-size:1rem;text-align:center;letter-spacing:-2px}
.chip b{font-family:var(--mono);font-size:.75rem;color:var(--accent);text-align:center}
.chip .led{width:26px;padding:3px;gap:1px;border-radius:5px}
.chip button{border:0;background:none;padding:2px 8px;font-size:1.1rem;line-height:1;color:var(--muted);cursor:pointer}
.chip .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rotrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.rotrow select{font:inherit;color:var(--ink);background:var(--raise);border:1.5px solid var(--line);border-radius:8px;padding:5px 8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.order{position:absolute;top:6px;right:8px;font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.tile:disabled{opacity:.4;cursor:default}
.sel{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toggle{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr}.tile{grid-template-columns:36px minmax(0,1fr);padding:8px;gap:8px}.tile .td{display:none}.now .big{width:64px;height:64px}}
</style>

<div class="wrap">
  <header class="top">
    <h1>Unicorn Remote</h1>
    <span class="conn" id="conn"><span class="dot" id="dot"></span><span id="connText">Connecting to the board…</span></span>
  </header>

  <section class="now" aria-labelledby="nowLabel">
    <div class="big led" id="nowLed" aria-hidden="true"></div>
    <div class="nowinfo">
      <span class="eyebrow" id="nowLabel">Now playing</span>
      <span class="nowname" id="nowName">Plasma</span>
      <span class="nowsub" id="nowSub">Power-on: Plasma</span>
      <div class="ctrls">
        <label class="bright" for="bright">Brightness <input type="range" id="bright" min="5" max="100" step="5" value="50"><output id="brightOut">50%</output></label>
        <button type="button" class="btn" id="stopBtn">Stop</button>
        <button type="button" class="btn" id="refreshBtn">Refresh</button>
      </div>
    </div>
  </section>

  <div class="msg" id="msg" hidden></div>

  <section class="rot" aria-labelledby="rotH">
    <div class="rothead"><h2 id="rotH">Rotation</h2><span class="foot" id="rotState">Loading the saved rotation…</span></div>
    <ol class="chips" id="rotChips" aria-label="Rotation order. Drag to reorder, or focus one and use the arrow keys."></ol>
    <div class="rotrow">
      <label for="rotEvery">Switch every</label>
      <select id="rotEvery"><option value="60">1 minute</option><option value="300">5 minutes</option><option value="600" selected>10 minutes</option><option value="900">15 minutes</option><option value="1800">30 minutes</option><option value="3600">1 hour</option></select>
      <label class="toggle" for="rotDefault"><input type="checkbox" id="rotDefault"> Also play at power-on</label>
      <button type="button" class="btn pri" id="rotStart">Start rotation</button>
    </div>
  </section>

  <div class="sel">
    <span class="foot" id="hint"></span>
    <div class="modes" role="group" aria-label="What tapping a program does">
      <button type="button" data-mode="play" aria-pressed="true">Play</button>
      <button type="button" data-mode="default" aria-pressed="false">Power-on</button>
      <button type="button" data-mode="rotation" aria-pressed="false">Rotation</button>
    </div>
  </div>

  <div id="library" style="display:flex;flex-direction:column;gap:22px"></div>

  <p class="foot">Classic Pimoroni programs restart the board while they play. Press the board's sleep button to come back to the remote.</p>
</div>

<script>
(() => {
  const SERVER = "stellar1";
  // What we know about each program we've made: name, what it does, its colours, its group.
  const CAT = {
    "plasma.py":      ["Plasma", "Rainbow sine waves rippling across the board", ["#ff3d6e","#ffb02e","#3ddc84","#3d7bff"], "Calm"],
    "lava_lamp.py":   ["Lava lamp", "Warm blobs rising and falling", ["#ff4b1f","#ff9a1f","#7a0f2a","#ffd166"], "Calm"],
    "goo.py":         ["Goo", "Slow glowing blobs that merge and split", ["#3df5c4","#1a9e8f","#0b3a4a","#9effe0"], "Calm"],
    "tides.py":       ["Tides", "Liquid waves in jewel tones", ["#1e1460","#0a6e8c","#d2a028","#c83c5a"], "Calm"],
    "drift.py":       ["Drift", "Glowing motes with fading trails", ["#3ab5b0","#5aa0d8","#8c78c8","#123"], "Calm"],
    "fractal.py":     ["Fractal", "A slowly evolving fractal in muted colours", ["#7d6b91","#a3b18a","#588b8b","#c8b6a6"], "Calm"],
    "garden.py":      ["Garden", "Plants that sprout, bloom and reseed", ["#3ddc84","#ff6fae","#ffd166","#5b3a1a"], "Calm"],
    "mercury.py":     ["Liquid metal", "Sloshing three-tone metal with splashes", ["#3d7bff","#c8e6ff","#8f3dff","#0a1440"], "Lively"],
    "morph.py":       ["Morph", "Kaleidoscope that melts between shapes", ["#ff3df0","#3dfff2","#ffe53d","#3d3dff"], "Lively"],
    "tunnel.py":      ["Tunnel", "Drive through a twisting neon tunnel", ["#ff2e88","#2ef2ff","#6a2eff","#ffd02e"], "Lively"],
    "warp.py":        ["Warp", "Stars streaking past at warp speed", ["#ffffff","#9fd3ff","#3d5aff","#0a0f2e"], "Lively"],
    "rainbow.py":     ["Rainbow", "Rainbow effects, three modes on A/B/C", ["#ff3d3d","#ffd23d","#3dff7a","#3d8bff"], "Lively"],
    "life.py":        ["Game of Life", "Cells that live, die and change colour", ["#ffffff","#7af0ff","#ff7ad9","#c8ff7a"], "Games"],
    "snake.py":       ["Snake", "Plays itself; A and B steer", ["#ff3d6e","#3dff9e","#ffe53d","#ff283c"], "Games"],
    "adventure.py":   ["Adventure", "An 8-bit theme song with a title card", ["#ffb02e","#ff5d3d","#fff3c4","#3d7bff"], "Music"],
    "fire.py":        ["Fire", "Pimoroni classic: flickering flames", ["#ff2a00","#ff8a00","#ffd000","#3a0a00"], "Classics"],
    "supercomputer.py": ["Supercomputer", "Pimoroni classic: blinking lights", ["#ff3d3d","#3dff7a","#3d8bff","#ffd23d"], "Classics"],
    "today.py":       ["Today", "Pimoroni classic: the date", ["#ffffff","#ff3d3d","#9fd3ff","#ffd23d"], "Classics"]
  };
  const ORDER = ["Calm", "Lively", "Games", "Music", "Classics", "Other"];
  const HIDE = n => /^main(_v\d+)?\.py$/.test(n) || /^install_/.test(n) || n === "rotation.py";
  const ROT = "rotation.py";
  const ENGINE = "# ---- the rest runs the playlist ----\nimport gc, time\n\ndef _load(name):\n    global cur, cur_name, cur_t0\n    cur, cur_name = None, None\n    gc.collect()\n    try:\n        with open(name) as f:\n            src = f.read()\n        if \"def frame\" not in src:\n            raise ValueError(\"old-style program\")\n        env = {\"__name__\": name[:-3]}\n        if \"local_time\" in globals():\n            env[\"local_time\"] = local_time\n        exec(src, env)\n        del src\n        G.set_font(\"bitmap8\")\n        G.set_pen(G.create_pen(0, 0, 0))\n        G.clear()\n        if \"setup\" in env:\n            env[\"setup\"](SU, G)\n        cur, cur_name = env, name\n    except Exception as e:\n        print(\"rotation: skipping\", name, repr(e))\n        bad.append(name)\n    cur_t0 = None\n\ndef _pick():\n    items = [n for n in PLAYLIST if n not in bad]\n    if not items:\n        return None\n    return items[int(time.time() // max(10, SECONDS)) % len(items)]\n\ndef setup(su, g):\n    global SU, G, bad, cur, cur_name, cur_t0\n    SU, G = su, g\n    bad, cur, cur_name, cur_t0 = [], None, None, None\n\ndef frame(su, g, t):\n    global cur_t0, cur\n    want = _pick()\n    if want is None:\n        g.set_pen(g.create_pen(0, 0, 0))\n        g.clear()\n        return 0.5\n    if want != cur_name:\n        _load(want)\n        if cur is None:\n            return 0.05\n    if cur_t0 is None:\n        cur_t0 = t\n    try:\n        return cur[\"frame\"](su, g, t - cur_t0)\n    except Exception as e:\n        print(\"rotation: error in\", cur_name, repr(e))\n        bad.append(cur_name)\n        cur = None\n        return 0.05\n";
  let mode = "play", rot = { list: [], secs: 600, loaded: false };
  const HINTS = { play: "Tap a program to play it.", default: "Tap the program that should play when the board powers on.", rotation: "Tap programs to add them to the rotation, in order. Tap again to take one out." };
  const LEGACY = new Set(["fire.py", "supercomputer.py", "today.py"]);
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Until the board answers, show the library we know about so the page isn't empty.
  let S = { online: null, programs: Object.keys(CAT).concat([]), running: null, def: null, brightness: 0.5, sample: true };
  let mcp = null, busy = false;

  const info = n => CAT[n] || [n.replace(/\.py$/, "").replace(/[_-]+/g, " ").replace(/^./, c => c.toUpperCase()), "", hashCols(n), "Other"];
  function hashCols(n) {
    let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return [0, 1, 2, 3].map(i => `hsl(${(h + i * 67) % 360} 85% ${50 + (i % 2) * 15}%)`);
  }
  function led(cols, n) {
    let s = ""; for (let i = 0; i < n * n; i++) { const x = i % n, y = (i / n) | 0, k = (x * 3 + y * 5 + ((x * y) % 3)) % 6; s += k < 4 ? `<i style="background:${cols[k]}"></i>` : "<i></i>"; }
    return s;
  }

  const everyText = s => s < 3600 ? (s / 60) + " min" : (s / 3600) + " h";
  const rotSummary = () => rot.list.length + " program" + (rot.list.length === 1 ? "" : "s") + ", every " + everyText(rot.secs);
  let drag = null;
  function renderRot() {
    const c = $("rotChips");
    c.innerHTML = rot.list.length ? rot.list.map((n, i) => `<li class="chip${drag && drag.i === i ? " dragging" : ""}" data-i="${i}" tabindex="0" aria-label="${i + 1}. ${esc(info(n)[0])}"><span class="grip" aria-hidden="true">⋮⋮</span><b>${i + 1}</b><span style="display:flex;gap:8px;align-items:center;min-width:0"><span class="led" aria-hidden="true">${led(info(n)[2], 4)}</span><span class="cn">${esc(info(n)[0])}</span></span><button type="button" data-rm="${esc(n)}" aria-label="Take ${esc(info(n)[0])} out of the rotation">×</button></li>`).join("")
      : '<li class="foot">No programs yet. Switch to “Rotation” below and tap the ones you want. Then drag them into order here.</li>';
    if (drag && drag.focus) { const el = c.querySelector(`[data-i="${drag.i}"]`); if (el) el.focus(); drag = null; }
    $("rotState").textContent = !rot.loaded ? "Loading the saved rotation…" : S.running === ROT ? "Playing now" : rot.list.length ? "Not playing" : "";
    $("rotStart").disabled = !rot.list.length;
    if (document.activeElement !== $("rotEvery")) { const v = String(rot.secs); if ([...$("rotEvery").options].some(o => o.value === v)) $("rotEvery").value = v; }
  }
  function rotCode() {
    return "# Rotation: plays a list of programs one after another, switching every\n# SECONDS. Set it up from the Unicorn Remote, or edit the two lines below.\n# Programs change on the clock, so after a restart it picks up where it was.\n# Old-style programs (ones with their own loop) are skipped.\n" +
      "PLAYLIST = " + JSON.stringify(rot.list).replace(/,/g, ", ") + "\nSECONDS = " + rot.secs + "\n\n" + ENGINE;
  }
  async function loadRot() {
    try {
      const r = await call("get_program_source", { name: ROT });
      const t = textOf(r);
      const m = t.match(/^PLAYLIST\s*=\s*(\[[^\]]*\])/m), sec = t.match(/^SECONDS\s*=\s*(\d+)/m);
      if (m) { try { rot.list = JSON.parse(m[1].replace(/'/g, '"')).filter(n => typeof n === "string"); } catch (e) {} }
      if (sec) rot.secs = +sec[1];
    } catch (e) { /* no saved rotation yet */ }
    rot.loaded = true; render();
  }

  function render() {
    const R = S.running, D = S.def;
    $("dot").className = "dot" + (S.online ? " on" : "");
    $("connText").textContent = S.sample ? "Connecting to the board…" : S.online ? "Board online" : "Board offline";
    if (R === ROT) { $("nowName").textContent = "Rotation"; $("nowLed").innerHTML = led(rot.list.length ? info(rot.list[0])[2] : ["#8f7bff", "#3df2ff", "#ff7ad9", "#ffd23d"], 6); }
    else if (R) { const I = info(R); $("nowName").textContent = I[0]; $("nowLed").innerHTML = led(I[2], 6); }
    else { $("nowName").textContent = S.sample ? "…" : "Nothing playing"; $("nowLed").innerHTML = led(["#333", "#333", "#333", "#333"], 6); }
    $("nowSub").textContent = (R === ROT ? rotSummary() + " · " : "") + (D ? "Power-on: " + (D === ROT ? "Rotation" : info(D)[0]) : "No power-on program");
    renderRot();
    const b = Math.round((S.brightness ?? 0.5) * 100); if (document.activeElement !== $("bright")) { $("bright").value = b; $("brightOut").textContent = b + "%"; }
    const groups = {};
    S.programs.filter(n => !HIDE(n)).forEach(n => { const g = info(n)[3]; (groups[g] = groups[g] || []).push(n); });
    $("library").innerHTML = ORDER.filter(g => groups[g]).map(g => `<section class="group"><h2>${esc(g)}</h2><div class="grid">${groups[g].map(n => {
      const I = info(n), on = n === R, star = n === D, ri = rot.list.indexOf(n), off = mode === "rotation" && LEGACY.has(n);
      return `<button type="button" class="tile" data-n="${esc(n)}" aria-pressed="${on}"${off ? " disabled" : ""}>${mode === "rotation" && ri >= 0 ? `<span class="order">${ri + 1}</span>` : ""}<div class="led" aria-hidden="true">${led(I[2], 4)}</div><span><span class="tn">${esc(I[0])}</span>${I[1] ? `<span class="td">${esc(I[1])}</span>` : ""}<span class="tags">${on ? '<span class="tag live">Playing</span>' : ""}${star ? '<span class="tag star">Power-on</span>' : ""}${LEGACY.has(n) ? '<span class="tag">Classic</span>' : ""}</span></span></button>`;
    }).join("")}</div></section>`).join("");
  }

  function note(text, kind, action) {
    const m = $("msg");
    if (!text) { m.hidden = true; return; }
    m.hidden = false; m.className = "msg" + (kind === "bad" ? " bad" : "");
    m.innerHTML = `<span>${esc(text)}</span>`;
    if (action) { const b = document.createElement("button"); b.type = "button"; b.className = "btn"; b.textContent = action[0]; b.onclick = action[1]; m.appendChild(b); }
  }
  function failNote(e, retry) {
    const c = e && e.code;
    if (c === "server_not_connected") note("The stellar1 connector isn't connected. Add it in claude.ai Settings → Connectors.", "bad");
    else if (c === "needs_reauth") note("Reconnect stellar1 in claude.ai Settings → Connectors.", "bad");
    else if (c === "not_in_manifest" || c === "approval_required" || c === "not_granted") note("This page needs your OK to control the board.", "bad", ["Allow and retry", retry]);
    else if (c === "tool_error") note("The board said: " + String(e.message || "error").slice(0, 200), "bad");
    else note("Couldn't reach the board just now.", "bad", ["Try again", retry]);
  }
  const textOf = r => { if (!r) return ""; if (typeof r.payload === "string") return r.payload; const t = (r.content || []).find(x => x.type === "text"); return t ? t.text : ""; };

  async function call(tool, input) {
    if (!mcp) throw { code: "capability_disabled" };
    return mcp.callTool(SERVER, tool, input || {}, { cache: false });
  }
  async function refresh() {
    try {
      const r = await call("get_board_status");
      let p = r.payload; if (typeof p === "string") { try { p = JSON.parse(p); } catch (e) { p = null; } }
      if (!p) { const t = textOf(r); try { p = JSON.parse(t); } catch (e) { p = null; } }
      if (!p) throw { code: "upstream_error" };
      const B = p.board || {};
      S = { online: !!p.online, programs: (B.programs || []).slice().sort((a, b) => info(a)[0].localeCompare(info(b)[0])), running: B.running || null, def: B.default || null, brightness: B.brightness, sample: false };
      if (!S.online) note("The board hasn't checked in recently. Is it plugged in and on Wi-Fi?", "bad"); else if (!busy) note("");
      render();
    } catch (e) { failNote(e, refresh); }
  }
  async function act(tool, input, done) {
    if (busy) return; busy = true;
    try { const r = await call(tool, input); const t = textOf(r); if (/^error/i.test(t)) note(t, "bad"); else { note(""); done && done(t); } render(); }
    catch (e) { failNote(e, () => act(tool, input, done)); }
    finally { busy = false; }
  }

  $("library").addEventListener("click", e => {
    const b = e.target.closest(".tile"); if (!b) return;
    const n = b.dataset.n;
    if (mode === "default") { act("set_default_program", { name: n }, () => { S.def = n; setMode("play"); }); return; }
    if (mode === "rotation") { const i = rot.list.indexOf(n); if (i >= 0) rot.list.splice(i, 1); else rot.list.push(n); render(); return; }
    if (LEGACY.has(n)) note(info(n)[0] + " restarts the board. Press the sleep button on the board to come back.");
    S.running = n; render();
    act("run_program", { name: n }, () => { S.running = n; });
  });
  $("stopBtn").onclick = () => act("stop_program", {}, () => { S.running = null; });
  $("refreshBtn").onclick = refresh;
  let bt = null;
  $("bright").addEventListener("input", e => {
    const v = +e.target.value; $("brightOut").textContent = v + "%";
    clearTimeout(bt); bt = setTimeout(() => act("set_brightness", { value: v / 100 }, () => { S.brightness = v / 100; }), 350);
  });
  function setMode(m) {
    mode = m; $("hint").textContent = HINTS[m];
    document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
    render();
  }
  document.querySelector(".modes").addEventListener("click", e => { const b = e.target.closest("[data-mode]"); if (b) setMode(b.dataset.mode); });
  $("rotChips").addEventListener("click", e => { const b = e.target.closest("[data-rm]"); if (!b) return; rot.list = rot.list.filter(n => n !== b.dataset.rm); render(); });
  // drag to reorder: pointer events, so it works with a finger as well as a mouse
  $("rotChips").addEventListener("pointerdown", e => {
    const c = e.target.closest(".chip"); if (!c || e.target.closest("[data-rm]")) return;
    drag = { i: +c.dataset.i }; c.classList.add("dragging"); e.preventDefault();
  });
  window.addEventListener("pointermove", e => {
    if (!drag) return;
    const el = document.elementFromPoint(e.clientX, e.clientY), over = el && el.closest("#rotChips .chip");
    if (!over) return;
    const j = +over.dataset.i; if (j === drag.i) return;
    const [n] = rot.list.splice(drag.i, 1); rot.list.splice(j, 0, n); drag.i = j; renderRot();
  });
  const endDrag = () => { if (drag) { drag = null; renderRot(); } };
  window.addEventListener("pointerup", endDrag); window.addEventListener("pointercancel", endDrag);
  // keyboard: arrow keys move the focused item
  $("rotChips").addEventListener("keydown", e => {
    const c = e.target.closest(".chip"); if (!c) return;
    const i = +c.dataset.i, d = e.key === "ArrowUp" || e.key === "ArrowLeft" ? -1 : e.key === "ArrowDown" || e.key === "ArrowRight" ? 1 : 0;
    if (!d || i + d < 0 || i + d >= rot.list.length) return;
    e.preventDefault(); const [n] = rot.list.splice(i, 1); rot.list.splice(i + d, 0, n); drag = { i: i + d, focus: true }; renderRot();
  });
  $("rotEvery").addEventListener("change", e => { rot.secs = +e.target.value; render(); });
  $("rotStart").onclick = () => {
    if (!rot.list.length) return;
    const mk = $("rotDefault").checked;
    act("upload_program", { name: ROT, code: rotCode(), run: true, make_default: mk }, t => { S.running = ROT; if (mk) S.def = ROT; setMode("play"); note("Rotation started: " + rotSummary() + "."); });
  };
  $("hint").textContent = HINTS.play;

  render();
  (async () => {
    const Cl = window.claude;
    try { mcp = Cl && Cl.use ? await Cl.use("mcp") : null; } catch (e) { mcp = null; }
    if (!mcp) { $("connText").textContent = "Open this in Claude to control the board"; note("This remote works inside claude.ai with the stellar1 connector.", "bad"); return; }
    await refresh();
    loadRot();
    setInterval(() => { if (!document.hidden && !busy) refresh(); }, 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
  })();
})();
</script>
