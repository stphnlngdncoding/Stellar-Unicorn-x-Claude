name = "unicorn-cloud"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Board"]

# the phone app's page is bundled as text (see remote/build_app.py)
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# night schedule: lights out at 8 pm and back on at 5 am Pacific (see NIGHT_* in
# src/worker.js). Both UTC hours are listed because daylight saving moves them.
[triggers]
crons = ["0 3,4,12,13 * * *"]
